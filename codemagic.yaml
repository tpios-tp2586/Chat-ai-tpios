workflows:
  ios-unsigned:
    name: Chat AI TPiOS - Build IPA
    max_build_duration: 60
    environment:
      xcode: 16.4
      cocoapods: default
    scripts:
      - name: Check required source files
        script: |
          set -e
          test -s project.yml
          test -s IMG_0290.png
          echo "Required project and icon files are present."

      - name: Install XcodeGen
        script: brew install xcodegen

      - name: Generate app icon
        script: |
          ICON_DIR="ChatAI/Assets.xcassets/AppIcon.appiconset"
          mkdir -p "$ICON_DIR"
          sips -s format png --resampleHeightWidth 1024 1024 IMG_0290.png --out "$ICON_DIR/icon-1024.png"
          sips -z 40 40   "$ICON_DIR/icon-1024.png" --out "$ICON_DIR/icon-20@2x.png"
          sips -z 60 60   "$ICON_DIR/icon-1024.png" --out "$ICON_DIR/icon-20@3x.png"
          sips -z 58 58   "$ICON_DIR/icon-1024.png" --out "$ICON_DIR/icon-29@2x.png"
          sips -z 87 87   "$ICON_DIR/icon-1024.png" --out "$ICON_DIR/icon-29@3x.png"
          sips -z 80 80   "$ICON_DIR/icon-1024.png" --out "$ICON_DIR/icon-40@2x.png"
          sips -z 120 120 "$ICON_DIR/icon-1024.png" --out "$ICON_DIR/icon-40@3x.png"
          sips -z 120 120 "$ICON_DIR/icon-1024.png" --out "$ICON_DIR/icon-40@3x.png"
          sips -z 120 120 "$ICON_DIR/icon-1024.png" --out "$ICON_DIR/icon-60@2x.png"
          sips -z 180 180 "$ICON_DIR/icon-1024.png" --out "$ICON_DIR/icon-60@3x.png"

      - name: Verify expression images in repo
        script: |
          echo "=== Contents of Reference/ ==="
          ls -la Reference/ || echo "Reference/ folder NOT FOUND"
          echo "=== Contents of Reference/FaceExpressions/ ==="
          ls -la Reference/FaceExpressions/ || echo "FaceExpressions/ folder NOT FOUND"

      - name: Generate Xcode project
        script: xcodegen generate

      - name: Build app (unsigned)
        script: |
          set -o pipefail
          xcodebuild \
            -project ChatAI.xcodeproj \
            -scheme ChatAI \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee build_output.txt
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "=== BUILD ERRORS ==="
            grep -A 5 "error:" build_output.txt || tail -100 build_output.txt
            exit 1
          fi

      - name: Copy and verify 8 transparent expression PNGs
        script: |
          set -eu
          APP_PATH="build/Build/Products/Release-iphoneos/ChatAI.app"
          SOURCE_DIR="Reference/FaceExpressions"
          if [ ! -d "$APP_PATH" ]; then
            echo "ERROR: Built app not found: $APP_PATH"
            exit 1
          fi
          if [ ! -d "$SOURCE_DIR" ]; then
            echo "ERROR: Image source folder not found: $SOURCE_DIR"
            exit 1
          fi

          images=(
            companion_angry.png
            companion_happy.png
            companion_neutral.png
            companion_sleepy.png
            companion_speaking.png
            companion_surprised.png
            companion_thinking.png
            companion_wink.png
          )

          echo "=== Copy transparent PNGs into ChatAI.app ==="
          mkdir -p "$APP_PATH/FaceExpressions"
          for image in "${images[@]}"; do
            if [ ! -s "$SOURCE_DIR/$image" ]; then
              echo "ERROR: Source PNG missing or empty: $SOURCE_DIR/$image"
              exit 1
            fi
            cp "$SOURCE_DIR/$image" "$APP_PATH/FaceExpressions/$image"
            if [ -s "$APP_PATH/FaceExpressions/$image" ]; then
              echo "OK: $image"
            else
              echo "ERROR: Failed to bundle $image"
              exit 1
            fi
          done
          echo "SUCCESS: All 8 transparent PNGs are bundled."
          
      - name: Losslessly optimize transparent PNGs
        script: |
          set -eu
          APP_IMAGE_DIR="build/Build/Products/Release-iphoneos/ChatAI.app/FaceExpressions"
          if [ ! -d "$APP_IMAGE_DIR" ]; then
            echo "ERROR: Bundled expression image folder not found: $APP_IMAGE_DIR"
            exit 1
          fi
          brew install oxipng
          echo "=== PNG sizes before lossless optimization ==="
          du -ch "$APP_IMAGE_DIR"/*.png | tail -1
          oxipng -o 4 --strip safe "$APP_IMAGE_DIR"/*.png
          echo "=== PNG sizes after lossless optimization ==="
          du -ch "$APP_IMAGE_DIR"/*.png | tail -1
          echo "Lossless PNG optimization complete; pixel data and transparency are preserved."

      - name: Package IPA
        script: |
          APP_PATH="build/Build/Products/Release-iphoneos/ChatAI.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "ERROR: App not found at $APP_PATH"
            ls -la build/Build/Products/Release-iphoneos/ || echo "Products folder not found"
            exit 1
          fi

          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r "chat-ai-tpios-$BUILD_NUMBER.ipa" Payload

    artifacts:
      - chat-ai-tpios-*.ipa