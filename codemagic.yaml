workflows:
  ios-unsigned:
    name: Chat AI TPiOS - IPA only
    max_build_duration: 60
    environment:
      xcode: 16.4
      cocoapods: default
    scripts:
      - name: Clean previous build outputs
        script: |
          rm -rf build Payload
          rm -f chat-ai-tpios-*.ipa build_output.txt
      - name: Check required source files
        script: |
          set -euo pipefail
          test -s project.yml
          test -s IMG_0290.png
          echo "Required project and icon files are present."

      - name: Install XcodeGen
        script: brew install xcodegen

      - name: Validate Alina model resource
        script: |
          set -euo pipefail
          test -s ChatAI/Resources/Alina.usdz
          unzip -tq ChatAI/Resources/Alina.usdz
          echo "OK: Alina.usdz is present in app resources ($(wc -c < ChatAI/Resources/Alina.usdz) bytes)"

      - name: Generate app icon
        script: |
          ICON_DIR="ChatAI/Assets.xcassets/AppIcon.appiconset"
          mkdir -p "$ICON_DIR"
          sips -s format png --resampleHeightWidth 1024 1024 IMG_0290.png --out "$ICON_DIR/icon-1024.png"
          sips -z 40 40   "$ICON_DIR/icon-1024.png" --out "$ICON_DIR/icon-20@2x.png"
          sips -z 60 60   "$ICON_DIR/icon-1024.png" --out "$ICON_DIR/icon-20@3x.png"
          sips -z 58 58   "$ICON_DIR/icon-1024.png" --out "$ICON_DIR/icon-29@2x.png"
          sips -z 87 87   "$ICON_DIR/icon-1024.png" --out "$ICON_DIR/icon-29@3x.png"
          sips -z 80 80   "$ICON_DIR/icon-1024.png" --out "$ICON_DIR/icon-40@2x.png"
          sips -z 120 120 "$ICON_DIR/icon-1024.png" --out "$ICON_DIR/icon-40@3x.png"
          sips -z 120 120 "$ICON_DIR/icon-1024.png" --out "$ICON_DIR/icon-60@2x.png"
          sips -z 180 180 "$ICON_DIR/icon-1024.png" --out "$ICON_DIR/icon-60@3x.png"

      - name: Generate Xcode project
        script: xcodegen generate

      - name: Build app (unsigned Release)
        script: |
          set -o pipefail
          xcodebuild \
            -project ChatAI.xcodeproj \
            -scheme ChatAI \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee build_output.txt
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "=== BUILD ERRORS ==="
            grep -A 5 "error:" build_output.txt || tail -100 build_output.txt
            exit 1
          fi

      - name: Package and verify IPA
        script: |
          set -euo pipefail
          APP_PATH="build/Build/Products/Release-iphoneos/ChatAI.app"
          test -d "$APP_PATH"
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          IPA_PATH="chat-ai-tpios-$BUILD_NUMBER.ipa"
          rm -f "$IPA_PATH"
          zip -qr "$IPA_PATH" Payload
          test -s "$IPA_PATH"
          unzip -tq "$IPA_PATH"
          echo "IPA READY: $IPA_PATH ($(wc -c < "$IPA_PATH") bytes)"

      - name: Remove temporary build files
        script: |
          rm -rf build Payload

    artifacts:
      - chat-ai-tpios-*.ipa
