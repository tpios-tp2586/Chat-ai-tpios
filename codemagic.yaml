workflows:
  ios-unsigned:
    name: Chat AI TPiOS - Build IPA
    max_build_duration: 60
    environment:
      groups:
        - ara_secrets
      xcode: 16.4
      cocoapods: default
    scripts:
      - name: Check required source files
        script: |
          set -e
          test -s project.yml
          test -s IMG_0290.png
          echo "Required project and icon files are present."

      - name: Download Ara USDZ Actions artifact into app resources
        script: |
          set -euo pipefail
          : "${GITHUB_TOKEN:?Missing GITHUB_TOKEN in Codemagic ara_secrets group}"
          : "${CM_COMMIT:?Missing Codemagic source commit SHA}"
          : "${BUILD_NUMBER:?Missing Codemagic build number}"

          ARTIFACTS_JSON="$(curl --fail --silent --show-error --get \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data-urlencode "name=ara-avatar-usdz" \
            --data-urlencode "per_page=100" \
            "https://api.github.com/repos/tpios-tp2586/Chat-ai-tpios/actions/artifacts")"
          ARTIFACT_ID="$(printf '%s' "$ARTIFACTS_JSON" | python3 -c 'import json,sys; sha=sys.argv[1]; a=[x for x in json.load(sys.stdin).get("artifacts",[]) if x.get("name")=="ara-avatar-usdz" and not x.get("expired") and x.get("workflow_run",{}).get("head_sha")==sha]; print(max(a,key=lambda x:x["created_at"])["id"] if a else "")' "$CM_COMMIT")"
          if [ -z "$ARTIFACT_ID" ]; then
            echo "ERROR: No ara-avatar-usdz artifact was generated from this exact source commit: $CM_COMMIT"
            exit 1
          fi
          echo "Using Ara artifact $ARTIFACT_ID generated from source commit $CM_COMMIT"

          mkdir -p ChatAI/Resources
          curl --fail --location --silent --show-error \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/tpios-tp2586/Chat-ai-tpios/actions/artifacts/$ARTIFACT_ID/zip" \
            --output ara-avatar-usdz.zip
          unzip -oq ara-avatar-usdz.zip -d ChatAI/Resources
          rm ara-avatar-usdz.zip

          test -s "ChatAI/Resources/Ara-Avatar.usdz"
          test -s "ChatAI/Resources/animation-timeline.json"
          echo "Ara USDZ and its animation timeline manifest are ready to be bundled."

      - name: Install XcodeGen
        script: brew install xcodegen

      - name: Generate app icon
        script: |
          ICON_DIR="ChatAI/Assets.xcassets/AppIcon.appiconset"
          mkdir -p "$ICON_DIR"
          sips -s format png --resampleHeightWidth 1024 1024 IMG_0290.png --out "$ICON_DIR/icon-1024.png"
          sips -z 40 40   "$ICON_DIR/icon-1024.png" --out "$ICON_DIR/icon-20@2x.png"
          sips -z 60 60   "$ICON_DIR/icon-1024.png" --out "$ICON_DIR/icon-20@3x.png"
          sips -z 58 58   "$ICON_DIR/icon-1024.png" --out "$ICON_DIR/icon-29@2x.png"
          sips -z 87 87   "$ICON_DIR/icon-1024.png" --out "$ICON_DIR/icon-29@3x.png"
          sips -z 80 80   "$ICON_DIR/icon-1024.png" --out "$ICON_DIR/icon-40@2x.png"
          sips -z 120 120 "$ICON_DIR/icon-1024.png" --out "$ICON_DIR/icon-40@3x.png"
          sips -z 120 120 "$ICON_DIR/icon-1024.png" --out "$ICON_DIR/icon-40@3x.png"
          sips -z 120 120 "$ICON_DIR/icon-1024.png" --out "$ICON_DIR/icon-60@2x.png"
          sips -z 180 180 "$ICON_DIR/icon-1024.png" --out "$ICON_DIR/icon-60@3x.png"

      - name: Generate Xcode project
        script: xcodegen generate

      - name: Build app (unsigned)
        script: |
          set -o pipefail
          xcodebuild \
            -project ChatAI.xcodeproj \
            -scheme ChatAI \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CHAT_AI_SOURCE_COMMIT="$CM_COMMIT" \
            CHAT_AI_BUILD_NUMBER="$BUILD_NUMBER" \
            build 2>&1 | tee build_output.txt
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "=== BUILD ERRORS ==="
            grep -A 5 "error:" build_output.txt || tail -100 build_output.txt
            exit 1
          fi

      - name: Package IPA
        script: |
          APP_PATH="build/Build/Products/Release-iphoneos/ChatAI.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "ERROR: App not found at $APP_PATH"
            ls -la build/Build/Products/Release-iphoneos/ || echo "Products folder not found"
            exit 1
          fi

          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qr "chat-ai-tpios-$BUILD_NUMBER.ipa" Payload

    artifacts:
      - chat-ai-tpios-*.ipa
