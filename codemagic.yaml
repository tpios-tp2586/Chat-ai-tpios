workflows:
  ios-unsigned:
    name: Chat AI TPiOS - Build IPA
    max_build_duration: 60
    environment:
      xcode: 16.4
      cocoapods: default
    scripts:
      - name: Check required source files
        script: |
          set -e
          test -s project.yml
          test -s IMG_0290.png
          echo "Required project and icon files are present."

      - name: Install XcodeGen
        script: brew install xcodegen

      - name: Generate app icon
        script: |
          ICON_DIR="ChatAI/Assets.xcassets/AppIcon.appiconset"
          mkdir -p "$ICON_DIR"
          sips -s format png --resampleHeightWidth 1024 1024 IMG_0290.png --out "$ICON_DIR/icon-1024.png"
          sips -z 40 40   "$ICON_DIR/icon-1024.png" --out "$ICON_DIR/icon-20@2x.png"
          sips -z 60 60   "$ICON_DIR/icon-1024.png" --out "$ICON_DIR/icon-20@3x.png"
          sips -z 58 58   "$ICON_DIR/icon-1024.png" --out "$ICON_DIR/icon-29@2x.png"
          sips -z 87 87   "$ICON_DIR/icon-1024.png" --out "$ICON_DIR/icon-29@3x.png"
          sips -z 80 80   "$ICON_DIR/icon-1024.png" --out "$ICON_DIR/icon-40@2x.png"
          sips -z 120 120 "$ICON_DIR/icon-1024.png" --out "$ICON_DIR/icon-40@3x.png"
          sips -z 120 120 "$ICON_DIR/icon-1024.png" --out "$ICON_DIR/icon-40@3x.png"
          sips -z 120 120 "$ICON_DIR/icon-1024.png" --out "$ICON_DIR/icon-60@2x.png"
          sips -z 180 180 "$ICON_DIR/icon-1024.png" --out "$ICON_DIR/icon-60@3x.png"

      - name: Generate Xcode project
        script: xcodegen generate

      - name: Build app (unsigned)
        script: |
          set -o pipefail
          xcodebuild \
            -project ChatAI.xcodeproj \
            -scheme ChatAI \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee build_output.txt
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "=== BUILD ERRORS ==="
            grep -A 5 "error:" build_output.txt || tail -100 build_output.txt
            exit 1
          fi

      - name: Verify 8 expression images are bundled
        script: |
          set -eu
          APP_PATH="build/Build/Products/Release-iphoneos/ChatAI.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "ERROR: Built app not found: $APP_PATH"
            exit 1
          fi

          echo "=== JPG files found anywhere inside ChatAI.app ==="
          find "$APP_PATH" -type f -iname '*.jpg' -print || true
          echo "=== Checking the 8 required expression images by filename ==="

          images=(
            companion_angry.jpg
            companion_happy.jpg
            companion_neutral.jpg
            companion_sleepy.jpg
            companion_speaking.jpg
            companion_surprised.jpg
            companion_thinking.jpg
            companion_wink.jpg
          )
          missing=0
          for image in "${images[@]}"; do
            found_path="$(find "$APP_PATH" -type f -name "$image" -print -quit)"
            if [ -n "$found_path" ]; then
              echo "OK: $image -> $found_path"
            else
              echo "ERROR: $image was not found anywhere inside ChatAI.app"
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            echo "ERROR: Required expression images are missing from the built app bundle."
            echo "The JPG listing above shows the actual resource paths for diagnosis."
            exit 1
          fi
          echo "SUCCESS: All 8 expression images are bundled. Continue to IPA packaging."

      - name: Package IPA
        script: |
          APP_PATH="build/Build/Products/Release-iphoneos/ChatAI.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "ERROR: App not found at $APP_PATH"
            ls -la build/Build/Products/Release-iphoneos/ || echo "Products folder not found"
            exit 1
          fi

          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r "chat-ai-tpios-$BUILD_NUMBER.ipa" Payload

    artifacts:
      - chat-ai-tpios-*.ipa
    
