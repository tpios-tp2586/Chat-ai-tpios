workflows:
  ios-unsigned:
    name: Chat AI TPiOS - Build IPA
    max_build_duration: 60
    environment:
      xcode: 16.4
      cocoapods: default
    scripts:
      - name: Check files
        script: |
          echo "=== Root files ==="
          ls -la
          echo "=== ChatAI folder ==="
          ls -la ChatAI/
          echo "=== project.yml ==="
          cat project.yml

      - name: Install XcodeGen
        script: brew install xcodegen

      - name: Check GLB-to-USDZ conversion tools
        script: |
          echo "=== macOS / Xcode ==="
          sw_vers
          xcodebuild -version
          echo "=== Potential USD / USDZ tools ==="
          for tool in usdz_converter realitytool usdzip usdcat blender; do
            if command -v "$tool" >/dev/null 2>&1; then
              echo "FOUND $tool: $(command -v "$tool")"
            else
              echo "NOT FOUND: $tool"
            fi
          done
          echo "=== Xcode toolchain lookup ==="
          for tool in usdz_converter realitytool; do
            if xcrun --find "$tool" >/dev/null 2>&1; then
              echo "XCRUN FOUND $tool: $(xcrun --find "$tool")"
            else
              echo "XCRUN NOT FOUND: $tool"
            fi
          done
          echo "=== realitytool command help ==="
          xcrun realitytool --help 2>&1 || true
          echo "=== realitytool subcommand discovery ==="
          xcrun realitytool help 2>&1 || true
          echo "=== usdzip help ==="
          usdzip --help 2>&1 || true
          echo "=== GLB input ==="
          GLB_SOURCE="ChatAI/Resources/Companion/model-1792924579279.glb"
          if [ -s "$GLB_SOURCE" ]; then
            ls -lh "$GLB_SOURCE"
            file "$GLB_SOURCE"
          else
            echo "ERROR: GLB input missing or empty: $GLB_SOURCE"
            exit 1
          fi

      - name: Generate app icon
        script: |
          ICON_DIR="ChatAI/Assets.xcassets/AppIcon.appiconset"
          mkdir -p "$ICON_DIR"
          sips -s format png --resampleHeightWidth 1024 1024 IMG_0290.png --out "$ICON_DIR/icon-1024.png"
          sips -z 40 40   "$ICON_DIR/icon-1024.png" --out "$ICON_DIR/icon-20@2x.png"
          sips -z 60 60   "$ICON_DIR/icon-1024.png" --out "$ICON_DIR/icon-20@3x.png"
          sips -z 58 58   "$ICON_DIR/icon-1024.png" --out "$ICON_DIR/icon-29@2x.png"
          sips -z 87 87   "$ICON_DIR/icon-1024.png" --out "$ICON_DIR/icon-29@3x.png"
          sips -z 80 80   "$ICON_DIR/icon-1024.png" --out "$ICON_DIR/icon-40@2x.png"
          sips -z 120 120 "$ICON_DIR/icon-1024.png" --out "$ICON_DIR/icon-40@3x.png"
          sips -z 120 120 "$ICON_DIR/icon-1024.png" --out "$ICON_DIR/icon-40@3x.png"
          sips -z 120 120 "$ICON_DIR/icon-1024.png" --out "$ICON_DIR/icon-60@2x.png"
          sips -z 180 180 "$ICON_DIR/icon-1024.png" --out "$ICON_DIR/icon-60@3x.png"

      - name: Convert GLB to USDZ with Blender
        script: |
          set -e
          GLB_SOURCE="ChatAI/Resources/Companion/model-1792924579279.glb"
          USD_DIR="ChatAI/Resources/Companion"
          USD_FILE="$USD_DIR/model-1792924579279.usd"
          USDZ_FILE="$USD_DIR/model-1792924579279.usdz"

          if [ ! -s "$GLB_SOURCE" ]; then
            echo "ERROR: GLB source missing: $GLB_SOURCE"
            exit 1
          fi

          echo "=== Install Blender ==="
          brew install --cask blender
          BLENDER="/Applications/Blender.app/Contents/MacOS/Blender"
          if [ ! -x "$BLENDER" ]; then
            echo "ERROR: Blender executable not found at $BLENDER"
            find /Applications -maxdepth 4 -iname '*blender*' -print || true
            exit 1
          fi
          "$BLENDER" --version

          echo "=== Import GLB and export USD ==="
          "$BLENDER" --background --python-expr "import bpy; bpy.ops.wm.read_factory_settings(use_empty=True); r=bpy.ops.import_scene.gltf(filepath='$GLB_SOURCE'); print('GLB_IMPORT_RESULT', r); print('OBJECT_COUNT', len(bpy.context.scene.objects)); assert len(bpy.context.scene.objects)>0, 'GLB import produced no objects'; e=bpy.ops.wm.usd_export(filepath='$USD_FILE', export_textures=True, overwrite=True); print('USD_EXPORT_RESULT', e)" 

          if [ ! -s "$USD_FILE" ]; then
            echo "ERROR: Blender did not create USD file: $USD_FILE"
            exit 1
          fi
          echo "=== Package USD and dependencies into USDZ ==="
          usdzip --arkitAsset "$USDZ_FILE" "$USD_FILE"
          if [ ! -s "$USDZ_FILE" ]; then
            echo "ERROR: USDZ package missing or empty: $USDZ_FILE"
            exit 1
          fi
          echo "=== USDZ created ==="
          ls -lh "$USDZ_FILE"
          usdzip --list "$USDZ_FILE"

      - name: Generate Xcode project
        script: xcodegen generate

      - name: Build app (unsigned)
        script: |
          set -o pipefail
          xcodebuild \
            -project ChatAI.xcodeproj \
            -scheme ChatAI \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee build_output.txt
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "=== BUILD ERRORS ==="
            grep -A 5 "error:" build_output.txt || tail -100 build_output.txt
            exit 1
          fi

      - name: Package IPA
        script: |
          APP_PATH="build/Build/Products/Release-iphoneos/ChatAI.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "ERROR: App not found at $APP_PATH"
            ls -la build/Build/Products/Release-iphoneos/ || echo "Products folder not found"
            exit 1
          fi

          # Ensure the GLB is physically inside ChatAI.app, even if XcodeGen's
          # resource phase changes how it handles the file path.
          GLB_SOURCE="ChatAI/Resources/Companion/model-1792924579279.glb"
          if [ ! -f "$GLB_SOURCE" ]; then
            echo "ERROR: Source GLB missing: $GLB_SOURCE"
            find ChatAI -iname "*.glb" -print
            exit 1
          fi
          cp "$GLB_SOURCE" "$APP_PATH/model-1792924579279.glb"
          if [ ! -s "$APP_PATH/model-1792924579279.glb" ]; then
            echo "ERROR: GLB copy into app bundle failed"
            exit 1
          fi
          echo "=== GLB bundled successfully ==="
          ls -lh "$APP_PATH/model-1792924579279.glb"

          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r "chat-ai-tpios-$BUILD_NUMBER.ipa" Payload

    artifacts:
      - chat-ai-tpios-*.ipa
