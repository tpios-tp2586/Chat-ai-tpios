workflows:
  ios-unsigned:
    name: Chat AI TPiOS - Build IPA
    max_build_duration: 60
    environment:
      groups:
        - ara_secrets
      xcode: 16.4
      cocoapods: default
    scripts:
      - name: Check required source files
        script: |
          set -e
          test -s project.yml
          test -s IMG_0290.png
          echo "Required project and icon files are present."

      - name: Download and bake Ara USDZ with OpenUSD
        script: |
          set -euo pipefail
          : "${GITHUB_TOKEN:?Missing GITHUB_TOKEN in Codemagic ara_secrets group}"

          USD_TMP="$(mktemp -d)"
          API="https://api.github.com/repos/tpios-tp2586/Chat-ai-tpios"

          api_get() {
            local url="$1" output="$2" status
            status="$(curl --silent --show-error --output "$output" --write-out '%{http_code}' \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer $GITHUB_TOKEN" \
              --header "X-GitHub-Api-Version: 2022-11-28" "$url")" || {
                echo "GitHub API transport failed: $url"
                return 1
              }
            case "$status" in
              2*) ;;
              *)
                echo "GitHub API returned HTTP $status: $url"
                python3 -c 'import json,sys; p=sys.argv[1]; d=json.load(open(p)); print("GitHub message: "+str(d.get("message","(no message)")))' "$output" 2>/dev/null || cat "$output"
                if [ "$status" = "403" ]; then
                  echo "Check GITHUB_TOKEN access for this endpoint: Release/commit APIs need Contents: Read; Actions APIs need Actions: Read."
                fi
                return 1
                ;;
            esac
          }

          api_get "$API/actions/workflows/generate-ara-usdz.yml/runs?branch=main&status=completed&per_page=1" "$USD_TMP/runs.json"
          RUN_INFO="$(python3 -c 'import json,sys; r=json.load(open(sys.argv[1])).get("workflow_runs",[]); x=r[0] if r else {}; print(str(x.get("id",""))+" "+str(x.get("head_sha",""))+" "+str(x.get("conclusion","")))' "$USD_TMP/runs.json")"
          read -r RUN_ID RUN_SHA RUN_CONCLUSION <<< "$RUN_INFO"
          test "$RUN_CONCLUSION" = "success" || {
            echo "Latest Ara workflow run did not succeed."
            exit 1
          }
          test -n "$RUN_ID" && test -n "$RUN_SHA" || {
            echo "No successful Ara workflow run found on main."
            exit 1
          }

          # Codemagic may use a shallow checkout. Fetch full main history before
          # checking ancestry; fetching RUN_SHA alone leaves it as a shallow root.
          MAIN_SHA="$(git rev-parse HEAD)"
          if ! git cat-file -e "$RUN_SHA^{commit}" 2>/dev/null; then
            git fetch --no-tags origin "$RUN_SHA"
          fi
          if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
            git fetch --no-tags --unshallow origin main
          else
            git fetch --no-tags origin main
          fi
          git merge-base --is-ancestor "$RUN_SHA" "$MAIN_SHA" || {
            echo "Ara asset run SHA is not an ancestor of the checked-out commit."
            exit 1
          }
          CHANGED_FILES="$(git diff --name-only "$RUN_SHA...$MAIN_SHA")"
          printf '%s\n' "$CHANGED_FILES" | python3 -c 'import sys; changed={x.strip() for x in sys.stdin if x.strip()}; allowed={"PROJECT_STATUS.md","codemagic.yaml","ChatAI/CompanionChatView.swift","ChatAI/AraAvatarView.swift","scripts/apply-ara-hip-sway.py"}; assert changed <= allowed, f"Non-documentation changes since Ara asset run: {sorted(changed-allowed)}"; print("Only status/pipeline documentation changed after the successful Ara asset run." if changed else "Build commit matches the successful Ara asset run.")'

          USE_ARTIFACT=0
          if api_get "$API/commits/ara-avatar-v5" "$USD_TMP/release-commit.json"; then
            RELEASE_SHA="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["sha"])' "$USD_TMP/release-commit.json")"
            test "$RELEASE_SHA" = "$RUN_SHA" || {
              echo "Release ara-avatar-v5 does not match the latest successful Ara workflow run."
              exit 1
            }

            if api_get "$API/releases/tags/ara-avatar-v5" "$USD_TMP/release.json" &&
              python3 -c 'import json,sys; a={x["name"]:x for x in json.load(open(sys.argv[1])).get("assets",[])}; names=("Ara-Avatar.usdz","animation-timeline.json","ara-asset-pipeline.txt"); missing=[n for n in names if n not in a]; assert not missing, f"Release assets missing: {missing}"; [print(n, a[n]["id"]) for n in names]' "$USD_TMP/release.json" > "$USD_TMP/asset-ids.txt"; then
              RELEASE_DOWNLOAD_OK=1
              while read -r ASSET_NAME ASSET_ID; do
                status="$(curl --silent --show-error --location --output "$USD_TMP/$ASSET_NAME" --write-out '%{http_code}' --header "Accept: application/octet-stream" --header "Authorization: Bearer $GITHUB_TOKEN" --header "X-GitHub-Api-Version: 2022-11-28" "$API/releases/assets/$ASSET_ID")" || status="000"
                case "$status" in
                  2*) ;;
                  *)
                    echo "Release asset download failed (HTTP $status): $ASSET_NAME"
                    RELEASE_DOWNLOAD_OK=0
                    break
                    ;;
                esac
              done < "$USD_TMP/asset-ids.txt"
              if [ "$RELEASE_DOWNLOAD_OK" = "0" ]; then
                USE_ARTIFACT=1
              fi
            else
              echo "Release metadata/assets unavailable; trying the matching Actions artifact."
              USE_ARTIFACT=1
            fi
          else
            echo "Release API is not accessible with this token; trying the matching Actions artifact."
            USE_ARTIFACT=1
          fi

          if [ "$USE_ARTIFACT" = "1" ]; then
            api_get "$API/actions/artifacts?name=ara-avatar-research-bundle&per_page=100" "$USD_TMP/artifacts.json"
            ARTIFACT_ID="$(python3 -c 'import json,sys; run_id=sys.argv[1]; a=[x for x in json.load(open(sys.argv[2])).get("artifacts",[]) if x.get("name")=="ara-avatar-research-bundle" and not x.get("expired") and str(x.get("workflow_run",{}).get("id",""))==run_id]; print(a[0]["id"] if a else "")' "$RUN_ID" "$USD_TMP/artifacts.json")"
            test -n "$ARTIFACT_ID" || {
              echo "No unexpired Ara research bundle exists for successful workflow run $RUN_ID."
              exit 1
            }
            curl --fail --location --silent --show-error --header "Accept: application/vnd.github+json" --header "Authorization: Bearer $GITHUB_TOKEN" --header "X-GitHub-Api-Version: 2022-11-28" "$API/actions/artifacts/$ARTIFACT_ID/zip" --output "$USD_TMP/ara-avatar-research-bundle.zip"
            mkdir -p "$USD_TMP/artifact"
            unzip -oq "$USD_TMP/ara-avatar-research-bundle.zip" -d "$USD_TMP/artifact"
            SOURCE_USDZ="$(find "$USD_TMP/artifact" -type f -name 'Ara-Avatar.usdz' -print -quit)"
            TIMELINE="$(find "$USD_TMP/artifact" -type f -name 'animation-timeline.json' -print -quit)"
            PIPELINE_MARKER="$(find "$USD_TMP/artifact" -type f -name 'ara-asset-pipeline.txt' -print -quit)"
          else
            SOURCE_USDZ="$USD_TMP/Ara-Avatar.usdz"
            TIMELINE="$USD_TMP/animation-timeline.json"
            PIPELINE_MARKER="$USD_TMP/ara-asset-pipeline.txt"
          fi

          test -s "$SOURCE_USDZ" || { echo "Ara-Avatar.usdz is missing from the artifact."; exit 1; }
          test -s "$TIMELINE" || { echo "animation-timeline.json is missing from the artifact."; exit 1; }
          test -s "$PIPELINE_MARKER" && grep -qx 'hips_sway_baked=false' "$PIPELINE_MARKER" || {
            echo "This is an old or already-baked Ara artifact. Run the updated GitHub workflow before Codemagic."
            exit 1
          }

          python3 -c 'import sys; assert (3, 9) <= sys.version_info[:2] < (3, 15), f"Unsupported Python: {sys.version}"'
          python3 -m venv "$USD_TMP/venv"
          USD_PY="$USD_TMP/venv/bin/python"
          "$USD_PY" -m pip install --disable-pip-version-check --only-binary=:all: usd-core==26.5
          "$USD_PY" -c 'from pxr import Usd, UsdSkel, UsdUtils; print("OpenUSD 26.5 modules imported")'

          mkdir -p ChatAI/Resources
          cp "$TIMELINE" ChatAI/Resources/animation-timeline.json
          "$USD_PY" scripts/apply-ara-hip-sway.py "$SOURCE_USDZ" ChatAI/Resources/Ara-Avatar.usdz "$TIMELINE" | tee "$USD_TMP/hip-sway-diagnostics.txt"
          grep -q '^Talk:' "$USD_TMP/hip-sway-diagnostics.txt"
          grep -q '^AraListening:' "$USD_TMP/hip-sway-diagnostics.txt"
          unzip -tq ChatAI/Resources/Ara-Avatar.usdz

          mkdir -p output-usdz
          "$USD_PY" scripts/inspect-ara-usdz-animation.py ChatAI/Resources/Ara-Avatar.usdz "$TIMELINE" | tee "$USD_TMP/usdz-animation-diagnostics.txt"
          grep -q 'Talk vs TalkExplain' "$USD_TMP/usdz-animation-diagnostics.txt"
          test -s ChatAI/Resources/Ara-Avatar.usdz

          echo "Ara USDZ baked and validated with OpenUSD before the Xcode build."

      - name: Install XcodeGen
        script: brew install xcodegen

      - name: Generate app icon
        script: |
          ICON_DIR="ChatAI/Assets.xcassets/AppIcon.appiconset"
          mkdir -p "$ICON_DIR"
          sips -s format png --resampleHeightWidth 1024 1024 IMG_0290.png --out "$ICON_DIR/icon-1024.png"
          sips -z 40 40   "$ICON_DIR/icon-1024.png" --out "$ICON_DIR/icon-20@2x.png"
          sips -z 60 60   "$ICON_DIR/icon-1024.png" --out "$ICON_DIR/icon-20@3x.png"
          sips -z 58 58   "$ICON_DIR/icon-1024.png" --out "$ICON_DIR/icon-29@2x.png"
          sips -z 87 87   "$ICON_DIR/icon-1024.png" --out "$ICON_DIR/icon-29@3x.png"
          sips -z 80 80   "$ICON_DIR/icon-1024.png" --out "$ICON_DIR/icon-40@2x.png"
          sips -z 120 120 "$ICON_DIR/icon-1024.png" --out "$ICON_DIR/icon-40@3x.png"
          sips -z 120 120 "$ICON_DIR/icon-1024.png" --out "$ICON_DIR/icon-40@3x.png"
          sips -z 120 120 "$ICON_DIR/icon-1024.png" --out "$ICON_DIR/icon-60@2x.png"
          sips -z 180 180 "$ICON_DIR/icon-1024.png" --out "$ICON_DIR/icon-60@3x.png"

      - name: Generate Xcode project
        script: xcodegen generate

      - name: Build app (unsigned)
        script: |
          set -o pipefail
          xcodebuild \
            -project ChatAI.xcodeproj \
            -scheme ChatAI \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee build_output.txt
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "=== BUILD ERRORS ==="
            grep -A 5 "error:" build_output.txt || tail -100 build_output.txt
            exit 1
          fi

      - name: Package IPA
        script: |
          APP_PATH="build/Build/Products/Release-iphoneos/ChatAI.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "ERROR: App not found at $APP_PATH"
            ls -la build/Build/Products/Release-iphoneos/ || echo "Products folder not found"
            exit 1
          fi

          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qr "chat-ai-tpios-$BUILD_NUMBER.ipa" Payload

    artifacts:
      - chat-ai-tpios-*.ipa
