workflows:
  ios-unsigned:
    name: Chat AI TPiOS - Build IPA
    max_build_duration: 60
    environment:
      xcode: 16.4
      cocoapods: default
    scripts:
      - name: Check required source files
        script: |
          set -e
          test -s project.yml
          test -s IMG_0290.png
          test -s ChatAI/Resources/Companion/Model-01.glb
          echo "Required project, icon, and Model-01.glb files are present."

      - name: Install XcodeGen
        script: brew install xcodegen

      - name: Generate app icon
        script: |
          ICON_DIR="ChatAI/Assets.xcassets/AppIcon.appiconset"
          mkdir -p "$ICON_DIR"
          sips -s format png --resampleHeightWidth 1024 1024 IMG_0290.png --out "$ICON_DIR/icon-1024.png"
          sips -z 40 40   "$ICON_DIR/icon-1024.png" --out "$ICON_DIR/icon-20@2x.png"
          sips -z 60 60   "$ICON_DIR/icon-1024.png" --out "$ICON_DIR/icon-20@3x.png"
          sips -z 58 58   "$ICON_DIR/icon-1024.png" --out "$ICON_DIR/icon-29@2x.png"
          sips -z 87 87   "$ICON_DIR/icon-1024.png" --out "$ICON_DIR/icon-29@3x.png"
          sips -z 80 80   "$ICON_DIR/icon-1024.png" --out "$ICON_DIR/icon-40@2x.png"
          sips -z 120 120 "$ICON_DIR/icon-1024.png" --out "$ICON_DIR/icon-40@3x.png"
          sips -z 120 120 "$ICON_DIR/icon-1024.png" --out "$ICON_DIR/icon-60@2x.png"
          sips -z 180 180 "$ICON_DIR/icon-1024.png" --out "$ICON_DIR/icon-60@3x.png"

      - name: Convert GLB to USDZ when needed
        script: |
          set -e
          GLB_SOURCE="ChatAI/Resources/Companion/Model-01.glb"
          USD_DIR="ChatAI/Resources/Companion"
          USD_FILE="$USD_DIR/Model-01.usd"
          USDZ_FILE="$USD_DIR/Model-01.usdz"

          test -s "$GLB_SOURCE"

          if [ -s "$USDZ_FILE" ] && [ "$USDZ_FILE" -nt "$GLB_SOURCE" ]; then
            echo "Reusing existing USDZ: $USDZ_FILE"
            ls -lh "$USDZ_FILE"
            exit 0
          fi

          echo "Installing Blender to convert Model-01.glb to USDZ..."
          brew install --cask blender
          BLENDER="/Applications/Blender.app/Contents/MacOS/Blender"
          if [ ! -x "$BLENDER" ]; then
            echo "ERROR: Blender executable not found."
            exit 1
          fi

          "$BLENDER" --background --python-expr "import bpy; bpy.ops.wm.read_factory_settings(use_empty=True); bpy.ops.import_scene.gltf(filepath='$GLB_SOURCE'); assert len(bpy.context.scene.objects)>0, 'GLB import produced no objects'; bpy.ops.wm.usd_export(filepath='$USD_FILE', check_existing=False, export_materials=True, export_textures_mode='NEW', generate_preview_surface=True)"

          test -s "$USD_FILE"
          usdzip --arkitAsset "$USD_FILE" "$USDZ_FILE"
          test -s "$USDZ_FILE"
          echo "Model-01 USDZ ready:"
          ls -lh "$USDZ_FILE"

      - name: Generate Xcode project
        script: xcodegen generate

      - name: Build app (unsigned)
        script: |
          set -o pipefail
          xcodebuild \
            -project ChatAI.xcodeproj \
            -scheme ChatAI \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee build_output.txt
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "=== BUILD ERRORS ==="
            grep -A 5 "error:" build_output.txt || tail -100 build_output.txt
            exit 1
          fi

      - name: Package IPA
        script: |
          APP_PATH="build/Build/Products/Release-iphoneos/ChatAI.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "ERROR: App not found at $APP_PATH"
            ls -la build/Build/Products/Release-iphoneos/ || echo "Products folder not found"
            exit 1
          fi

          GLB_SOURCE="ChatAI/Resources/Companion/Model-01.glb"
          if [ ! -f "$GLB_SOURCE" ]; then
            echo "ERROR: Source GLB missing: $GLB_SOURCE"
            find ChatAI -iname "*.glb" -print
            exit 1
          fi
          cp "$GLB_SOURCE" "$APP_PATH/Model-01.glb"
          test -s "$APP_PATH/Model-01.glb"
          echo "=== Model-01.glb bundled successfully ==="
          ls -lh "$APP_PATH/Model-01.glb"

          USDZ_SOURCE="ChatAI/Resources/Companion/Model-01.usdz"
          if [ ! -s "$USDZ_SOURCE" ]; then
            echo "ERROR: Converted USDZ missing: $USDZ_SOURCE"
            exit 1
          fi
          cp "$USDZ_SOURCE" "$APP_PATH/Model-01.usdz"
          echo "=== Model-01.usdz bundled successfully ==="
          ls -lh "$APP_PATH/Model-01.usdz"

          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r "chat-ai-tpios-$BUILD_NUMBER.ipa" Payload

    artifacts:
      - chat-ai-tpios-*.ipa
