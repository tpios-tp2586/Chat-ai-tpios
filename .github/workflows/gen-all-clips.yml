name: Generate all Ara per-clip USDZ (v7)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up usdz-forge
        uses: actions/checkout@v4
        with:
          repository: robotson/usdz-forge
          ref: d474129ce1f026fa6904c9ac95dd74212a501a9d
          path: usdz-forge

      - name: Setup usdz-forge engine
        working-directory: usdz-forge
        run: ./engine/setup-engine.sh

      - name: Download Athletic_woman.glb from release v5
        run: |
          curl -L --fail -o Athletic_woman.glb \
            "https://github.com/tpios-tp2586/Chat-ai-tpios/releases/download/ara-avatar-v5/Athletic_woman.glb"
          test -s Athletic_woman.glb
          echo "GLB size: $(wc -c < Athletic_woman.glb) bytes"
          node scripts/inspect-ara-animation.mjs Athletic_woman.glb

      - name: Split all clips into per-clip GLB files
        run: |
          mkdir -p clips-glb
          PY="$GITHUB_WORKSPACE/usdz-forge/engine/python/bin/python3.14"

          # Use split script v1 logic extended to all clips
          node - <<'JS'
          import fs from "node:fs";
          import path from "node:path";

          const data = fs.readFileSync("Athletic_woman.glb");
          let offset = 12;
          let json = null;
          let binaryChunk = null;
          while (offset < data.length) {
            const length = data.readUInt32LE(offset);
            const type = data.readUInt32LE(offset + 4);
            const chunk = data.subarray(offset + 8, offset + 8 + length);
            if (type === 0x4E4F534A) json = JSON.parse(chunk.toString("utf8").trim());
            if (type === 0x004E4942) binaryChunk = chunk;
            offset += 8 + length;
          }

          function writeGLB(name, animations) {
            const jsonBytes = Buffer.from(JSON.stringify({ ...json, animations }));
            const jsonPadding = (4 - jsonBytes.length % 4) % 4;
            const paddedJson = Buffer.concat([jsonBytes, Buffer.alloc(jsonPadding, 0x20)]);
            const binPadding = (4 - binaryChunk.length % 4) % 4;
            const paddedBin = Buffer.concat([binaryChunk, Buffer.alloc(binPadding)]);
            const totalLength = 12 + 8 + paddedJson.length + 8 + paddedBin.length;
            const header = Buffer.alloc(12);
            header.write("glTF", 0); header.writeUInt32LE(2, 4); header.writeUInt32LE(totalLength, 8);
            const jh = Buffer.alloc(8); jh.writeUInt32LE(paddedJson.length, 0); jh.writeUInt32LE(0x4E4F534A, 4);
            const bh = Buffer.alloc(8); bh.writeUInt32LE(paddedBin.length, 0); bh.writeUInt32LE(0x004E4942, 4);
            fs.writeFileSync(path.join("clips-glb", `Ara-${name}.glb`),
              Buffer.concat([header, jh, paddedJson, bh, paddedBin]));
            console.log(`OK: Ara-${name}.glb (${animations[0].name})`);
          }

          // Write all animations as individual GLB files
          const animations = json.animations ?? [];
          console.log(`Total animations in GLB: ${animations.length}`);
          animations.forEach((anim, i) => {
            const safeName = (anim.name || `Clip${i}`)
              .replace(/[^a-zA-Z0-9_-]/g, "_")
              .replace(/^mixamo_com_?/i, "")
              .replace(/^_+|_+$/g, "");
            writeGLB(safeName || `Clip${i}`, [anim]);
          });
          JS

          ls -lh clips-glb/

      - name: Convert all per-clip GLB to USDZ
        run: |
          mkdir -p clips-usdz
          PY="$GITHUB_WORKSPACE/usdz-forge/engine/python/bin/python3.14"
          FAIL=0
          for GLB in clips-glb/*.glb; do
            NAME=$(basename "$GLB" .glb)
            DEST="clips-usdz/${NAME}.usdz"
            # Compact first
            COMPACT="clips-glb/${NAME}-compact.glb"
            node scripts/compact-glb-primitives.mjs "$GLB" "$COMPACT" 2>/dev/null || cp "$GLB" "$COMPACT"
            "$PY" usdz-forge/engine/native/usdzconvert -v "$COMPACT" "$DEST" 2>&1
            if test -s "$DEST"; then
              echo "OK: ${NAME}.usdz ($(wc -c < "$DEST") bytes)"
            else
              echo "FAILED: ${NAME}.usdz"
              FAIL=1
            fi
          done
          ls -lh clips-usdz/
          [ $FAIL -eq 0 ] || { echo "Some clips failed to convert"; exit 1; }

      - name: Publish all per-clip USDZ to release v7
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ara-avatar-v7
          name: Ara Avatar — All clips per-USDZ v7
          body: |
            All animation clips from Athletic_woman.glb split into individual USDZ files.
            Each file = 1 clip, full mesh + skeleton + animation binding, ready for RealityKit.
            Source: ara-avatar-v5/Athletic_woman.glb
            Generated by: split-glb-animations v1 logic + usdz-forge usdzconvert
          files: clips-usdz/*.usdz
          fail_on_unmatched_files: true
