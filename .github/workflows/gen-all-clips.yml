name: Generate all Ara per-clip USDZ (v7)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up usdz-forge
        uses: actions/checkout@v4
        with:
          repository: robotson/usdz-forge
          ref: d474129ce1f026fa6904c9ac95dd74212a501a9d
          path: usdz-forge

      - name: Setup usdz-forge engine
        working-directory: usdz-forge
        run: ./engine/setup-engine.sh

      - name: Download Athletic_woman.glb from release v5
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -L --fail             -H "Authorization: token $GH_TOKEN"             -H "Accept: application/octet-stream"             "https://api.github.com/repos/tpios-tp2586/Chat-ai-tpios/releases/assets/698530660"             -o Athletic_woman.glb
          test -s Athletic_woman.glb
          echo "GLB size: $(wc -c < Athletic_woman.glb) bytes"

      - name: Split all animations into per-clip GLB files
        run: |
          mkdir -p clips-glb
          node - <<'JSEOF'
          import fs from "node:fs";
          import path from "node:path";

          const data = fs.readFileSync("Athletic_woman.glb");
          if (data.toString("ascii", 0, 4) !== "glTF") throw new Error("Not a GLB file");

          let offset = 12, json = null, binaryChunk = null;
          while (offset < data.length) {
            const length = data.readUInt32LE(offset);
            const type   = data.readUInt32LE(offset + 4);
            const chunk  = data.subarray(offset + 8, offset + 8 + length);
            if (type === 0x4E4F534A) json = JSON.parse(chunk.toString("utf8").trim());
            if (type === 0x004E4942) binaryChunk = chunk;
            offset += 8 + length;
          }
          if (!json || !binaryChunk) throw new Error("Missing JSON or BIN chunk");

          function writeGLB(name, animations) {
            const jBytes = Buffer.from(JSON.stringify({ ...json, animations }));
            const jPad = (4 - jBytes.length % 4) % 4;
            const pJson = Buffer.concat([jBytes, Buffer.alloc(jPad, 0x20)]);
            const bPad = (4 - binaryChunk.length % 4) % 4;
            const pBin  = Buffer.concat([binaryChunk, Buffer.alloc(bPad)]);
            const total = 12 + 8 + pJson.length + 8 + pBin.length;
            const hdr = Buffer.alloc(12);
            hdr.write("glTF", 0); hdr.writeUInt32LE(2, 4); hdr.writeUInt32LE(total, 8);
            const jh = Buffer.alloc(8); jh.writeUInt32LE(pJson.length, 0); jh.writeUInt32LE(0x4E4F534A, 4);
            const bh = Buffer.alloc(8); bh.writeUInt32LE(pBin.length, 0);  bh.writeUInt32LE(0x004E4942, 4);
            fs.writeFileSync(path.join("clips-glb", `Ara-${name}.glb`),
              Buffer.concat([hdr, jh, pJson, bh, pBin]));
            console.log(`OK: Ara-${name}.glb`);
          }

          const animations = json.animations ?? [];
          console.log(`Total animations: ${animations.length}`);
          animations.forEach((anim, i) => {
            const raw = anim.name || `Clip${i}`;
            const safe = raw.replace(/[^a-zA-Z0-9_-]/g, "_")
                           .replace(/^mixamo_com_?/i, "")
                           .replace(/^_+|_+$/g, "") || `Clip${i}`;
            writeGLB(safe, [anim]);
          });
          JSEOF
          echo "GLB clips created:"
          ls -lh clips-glb/

      - name: Convert all per-clip GLB to USDZ
        run: |
          mkdir -p clips-usdz
          PY="$GITHUB_WORKSPACE/usdz-forge/engine/python/bin/python3.14"
          FAIL=0
          for GLB in clips-glb/Ara-*.glb; do
            NAME=$(basename "$GLB" .glb)
            COMPACT="clips-glb/${NAME}-compact.glb"
            DEST="clips-usdz/${NAME}.usdz"
            node scripts/compact-glb-primitives.mjs "$GLB" "$COMPACT" 2>/dev/null || cp "$GLB" "$COMPACT"
            "$PY" usdz-forge/engine/native/usdzconvert -v "$COMPACT" "$DEST" 2>&1 || true
            if test -s "$DEST"; then
              echo "OK: ${NAME}.usdz ($(wc -c < "$DEST") bytes)"
            else
              echo "SKIP: ${NAME}.usdz (convert failed)"
              FAIL=1
            fi
          done
          echo "--- USDZ clips ready ---"
          ls -lh clips-usdz/
          [ $FAIL -eq 0 ] || echo "WARNING: some clips failed to convert"

      - name: Publish all per-clip USDZ to release v7
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ara-avatar-v7
          name: Ara Avatar — All clips per-USDZ v7
          body: |
            All animation clips from Athletic_woman.glb split into individual USDZ files.
            Each file = 1 clip + full mesh/skeleton/animation binding, ready for RealityKit.
            Source: ara-avatar-v5/Athletic_woman.glb
            Tool: split GLB binary + usdz-forge usdzconvert
          files: clips-usdz/*.usdz
          fail_on_unmatched_files: false
