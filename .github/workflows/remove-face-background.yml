name: Remove Background from Face Expressions

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: remove-face-background-main
  cancel-in-progress: false

jobs:
  remove-background:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install background removal tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install "rembg[cpu]" pillow

      - name: Remove background from the 8 source images
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          from rembg import remove, new_session

          folder = Path("Reference/FaceExpressions")
          names = [
              "companion_angry.jpg",
              "companion_happy.jpg",
              "companion_neutral.jpg",
              "companion_sleepy.jpg",
              "companion_speaking.jpg",
              "companion_surprised.jpg",
              "companion_thinking.jpg",
              "companion_wink.jpg",
          ]

          missing = [name for name in names if not (folder / name).is_file()]
          if missing:
              raise SystemExit("Missing source images: " + ", ".join(missing))

          session = new_session("u2net")
          for name in names:
              source = folder / name
              output = folder / (source.stem + ".png")
              with Image.open(source) as image:
                  rgba = remove(image.convert("RGBA"), session=session)
                  if rgba.mode != "RGBA":
                      rgba = rgba.convert("RGBA")
                  alpha = rgba.getchannel("A")
                  if alpha.getextrema() == (255, 255):
                      raise SystemExit(f"Background removal produced no transparency: {name}")
                  rgba.save(output, format="PNG", optimize=True)
              with Image.open(output) as check:
                  if check.format != "PNG" or check.mode != "RGBA":
                      raise SystemExit(f"Invalid transparent PNG: {output}")
              print(f"OK: {source} -> {output} ({output.stat().st_size} bytes)")

          print("SUCCESS: all 8 transparent PNG files generated.")
          PY

      - name: Commit transparent PNG files to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Reference/FaceExpressions/companion_*.png
          if git diff --cached --quiet; then
            echo "No new PNG changes to commit."
            exit 0
          fi
          git commit -m "Add transparent face expression PNGs"
          git push origin HEAD:main
