name: Backup TPIOS Release

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify successful build for this state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          RUNS=$(gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows/build.yml/runs?head_sha=${GITHUB_SHA}&status=success&per_page=1")
          COUNT=$(printf '%s' "$RUNS" | jq '.total_count')

          if [ "$COUNT" -ge 1 ]; then
            echo "Verified successful build for ${GITHUB_SHA}."
            exit 0
          fi

          PARENT_SHA=$(git rev-parse HEAD^)
          CHANGED_FILES=$(git diff-tree --no-commit-id --name-only -r HEAD)

          if printf '%s\n' "$CHANGED_FILES" | grep -Ev '^\.github/workflows/backup-release\.yml$' | grep -q .; then
            echo "No successful build found and non-backup changes are present."
            exit 1
          fi

          PARENT_RUNS=$(gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows/build.yml/runs?head_sha=${PARENT_SHA}&status=success&per_page=1")
          PARENT_COUNT=$(printf '%s' "$PARENT_RUNS" | jq '.total_count')

          if [ "$PARENT_COUNT" -lt 1 ]; then
            echo "No successful build found for current or parent commit."
            exit 1
          fi

      - name: Create complete repository ZIP
        id: package
        run: |
          set -euo pipefail

          export TZ=Asia/Ho_Chi_Minh
          DATE=$(date +%Y-%m-%d_%H-%M-%S)
          SHORT_SHA=$(git rev-parse --short=7 HEAD)
          NAME="TPIOS-BACKUP-${DATE}-${SHORT_SHA}"
          ZIP="${NAME}.zip"

          # Archive every committed file with its original repository path.
          git archive --format=zip --output="$ZIP" HEAD

          # Also add a phone-visible copy because iOS Files may hide .github.
          # The original .github/workflows paths remain in the ZIP unchanged.
          mkdir -p workflows
          cp .github/workflows/*.yml workflows/
          zip -qr "$ZIP" workflows/

          {
            echo "TPIOS Repository Backup"
            echo "Date: ${DATE} (Asia/Ho_Chi_Minh)"
            echo "Commit: ${GITHUB_SHA}"
            echo "Repository: ${GITHUB_REPOSITORY}"
            echo "Build: verified successful"
            echo "Note: workflows/ is a visible copy; originals remain under .github/workflows/."
          } > TPIOS-BACKUP-INFO.txt

          zip -q "$ZIP" TPIOS-BACKUP-INFO.txt

          # Validate originals and the visible copies explicitly.
          for FILE in .github/workflows/build.yml .github/workflows/backup-release.yml; do
            test -f "$FILE" || { echo "Missing source file: $FILE"; exit 1; }
            unzip -Z1 "$ZIP" | grep -Fxq "$FILE" || {
              echo "Missing original workflow path in ZIP: $FILE"
              exit 1
            }
            VISIBLE="workflows/${FILE##*/}"
            unzip -Z1 "$ZIP" | grep -Fxq "$VISIBLE" || {
              echo "Missing phone-visible workflow copy in ZIP: $VISIBLE"
              exit 1
            }
          done

          unzip -Z1 "$ZIP" | grep -Fxq "TPIOS-BACKUP-INFO.txt"
          echo "Validated both workflow files in original and phone-visible paths."
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release with full backup
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NAME: ${{ steps.package.outputs.name }}
          ZIP_FILE: ${{ steps.package.outputs.zip }}
        run: |
          set -euo pipefail
          gh release create "backup-${RELEASE_NAME#TPIOS-BACKUP-}" \
            "$ZIP_FILE" \
            .github/workflows/build.yml \
            .github/workflows/backup-release.yml \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_NAME" \
            --generate-notes \
            --notes "Full repository backup. Original workflow paths are preserved, and a visible workflows/ copy is included for iPhone browsing."
