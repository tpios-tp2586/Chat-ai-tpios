name: Generate Ara USDZ avatar assets

on:
  workflow_dispatch:
    inputs:
      preset:
        description: Ara character preset
        required: true
        default: Athletic woman
        type: choice
        options:
          - Athletic woman
          - Athletic man
      detail:
        description: Mesh detail
        required: true
        default: high
        type: choice
        options:
          - medium
          - high

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out ChatAI
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check out Ara generator
        uses: actions/checkout@v4
        with:
          repository: olatunde85/3d-gen
          path: ara

      - name: Install Ara dependencies
        working-directory: ara
        run: npm install

      - name: Generate and verify rigged GLB
        working-directory: ara
        run: |
          mkdir -p ../output
          npm run setup-assets
          npm run export -- --preset "${{ inputs.preset }}" --detail "${{ inputs.detail }}" --formats glb --out ../output
          cd ..
          GLB="$(find output -maxdepth 1 -type f -name '*.glb' -print -quit)"
          test -n "$GLB"
          node scripts/verify-glb.mjs "$GLB"

      - name: Upload GLB intermediate artifact
        uses: actions/upload-artifact@v4
        with:
          name: ara-avatar-glb
          path: |
            output/*.glb
            output/verification-report.txt
          if-no-files-found: error
          retention-days: 14

  convert:
    needs: generate
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Check out ChatAI
        uses: actions/checkout@v4

      - name: Download GLB intermediate artifact
        uses: actions/download-artifact@v4
        with:
          name: ara-avatar-glb
          path: input

      - name: Check out USDZ Forge
        uses: actions/checkout@v4
        with:
          repository: robotson/usdz-forge
          path: usdz-forge

      - name: Set up USDZ conversion engine
        working-directory: usdz-forge
        run: ./engine/setup-engine.sh

      - name: Split, compact, convert and verify USDZ clips
        run: |
          set -euo pipefail
          GLB="$(find input -maxdepth 1 -type f -name '*.glb' -print -quit)"
          test -n "$GLB"
          mkdir -p clips output-usdz
          node scripts/split-glb-animations.mjs "$GLB" clips
          PY="$GITHUB_WORKSPACE/usdz-forge/engine/python/bin/python3.14"
          : > output-usdz/usdz-report.txt
          for CLIP in Idle Wave Talk; do
            SOURCE="clips/Ara-$CLIP.glb"
            COMPACT="clips/Ara-$CLIP.compact.glb"
            DEST="output-usdz/Ara-$CLIP.usdz"
            node scripts/compact-glb-primitives.mjs "$SOURCE" "$COMPACT"
            "$PY" usdz-forge/engine/native/usdzconvert -v "$COMPACT" "$DEST"
            "$PY" usdz-forge/engine/inspect_usdz.py "$DEST" | tee -a output-usdz/usdz-report.txt
            ANIMATED="$("$PY" usdz-forge/engine/native/probe_usdz.py "$DEST")"
            test "$ANIMATED" = "1"
          done
          shasum -a 256 output-usdz/Ara-*.usdz | tee output-usdz/SHA256SUMS.txt

      - name: Upload USDZ intermediate artifact
        uses: actions/upload-artifact@v4
        with:
          name: ara-avatar-usdz
          path: output-usdz/*
          if-no-files-found: error
          retention-days: 14

      - name: Publish USDZ files to ChatAI Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ara-avatar-v1
          name: Ara Avatar USDZ Assets
          body: |
            Generated by the ChatAI workflow.
            Contains verified Idle, Wave and Talk USDZ animation clips.
          files: |
            output-usdz/Ara-Idle.usdz
            output-usdz/Ara-Wave.usdz
            output-usdz/Ara-Talk.usdz
            output-usdz/SHA256SUMS.txt
            output-usdz/usdz-report.txt
          fail_on_unmatched_files: true
          overwrite_files: true
