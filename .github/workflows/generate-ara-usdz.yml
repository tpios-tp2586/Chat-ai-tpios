name: Generate Ara USDZ avatar assets

on:
  workflow_dispatch:
    inputs:
      preset:
        description: Ara character preset
        required: true
        default: Athletic woman
        type: choice
        options:
          - Athletic woman
          - Athletic man
      detail:
        description: Mesh detail
        required: true
        default: high
        type: choice
        options:
          - medium
          - high
      source_run_id:
        description: Optional prior run ID containing ara-avatar-glb; skips GLB generation
        required: false
        default: ""
        type: string

permissions:
  actions: read
  contents: write

jobs:
  generate:
    if: ${{ inputs.source_run_id == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out ChatAI
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check out pinned Ara generator source
        uses: actions/checkout@v4
        with:
          repository: olatunde85/3d-gen
          ref: e26cdef1464a0babf23bb0235b5f05930301ee25
          path: ara

      - name: Apply ChatAI conversational gesture
        run: node scripts/apply-ara-talk-explain.mjs ara

      - name: Install Ara dependencies
        working-directory: ara
        run: npm install

      - name: Generate and verify rigged GLB
        working-directory: ara
        run: |
          mkdir -p ../output
          npm run setup-assets
          npm run export -- --preset "${{ inputs.preset }}" --detail "${{ inputs.detail }}" --formats glb --out ../output
          cd ..
          GLB="$(find output -maxdepth 1 -type f -name '*.glb' -print -quit)"
          test -n "$GLB"
          node scripts/verify-glb.mjs "$GLB"
          node scripts/inspect-ara-animation.mjs "$GLB"

      - name: Upload GLB intermediate artifact
        uses: actions/upload-artifact@v4
        with:
          name: ara-avatar-glb
          path: |
            output/*.glb
            output/verification-report.txt
            output/animation-diagnostics.txt
          if-no-files-found: error
          retention-days: 90

  convert:
    needs: generate
    if: ${{ always() && (needs.generate.result == 'success' || inputs.source_run_id != '') }}
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Check out ChatAI
        uses: actions/checkout@v4

      - name: Download GLB intermediate artifact
        uses: actions/download-artifact@v4
        with:
          name: ara-avatar-glb
          path: input
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_run_id || github.run_id }}

      - name: Check out USDZ Forge
        uses: actions/checkout@v4
        with:
          repository: robotson/usdz-forge
          ref: d474129ce1f026fa6904c9ac95dd74212a501a9d
          path: usdz-forge

      - name: Prepare USDZ texture packaging
        run: |
          python3 - <<'PY'
          from pathlib import Path

          converter = Path("usdz-forge/engine/native/usdzconvert")
          source = converter.read_text()
          old = """    if dstIsUsdz:
                  # construct .usdz archive from the .usdc file
                  UsdUtils.CreateNewARKitUsdzPackage(tmpPath, dstPath)
          """
          new = """    if dstIsUsdz:
                  # The GLB reader writes embedded images under textures/.
                  # Stage them at the ARKit package's localized 0/ path.
                  textures = os.path.join(tmpFolder, 'textures')
                  if os.path.isdir(textures):
                      copytree(textures, os.path.join(tmpFolder, '0'), dirs_exist_ok=True)
                  # construct .usdz archive from the .usdc file
                  UsdUtils.CreateNewARKitUsdzPackage(tmpPath, dstPath)
          """
          if source.count(old) != 1:
              raise SystemExit("Could not safely locate the USDZ packaging block")
          converter.write_text(source.replace(old, new, 1))
          print("Prepared embedded GLB textures for ARKit USDZ packaging.")
          PY

      - name: Set up USDZ conversion engine
        working-directory: usdz-forge
        run: ./engine/setup-engine.sh

      - name: Convert, inspect and archive Ara research data
        run: |
          set -euo pipefail
          GLB="$(find input -maxdepth 1 -type f -name '*.glb' -print -quit)"
          test -n "$GLB"
          mkdir -p clips output-usdz
          printf 'hips_sway_baked=false\n' > output-usdz/ara-asset-pipeline.txt
          node scripts/split-glb-animations.mjs "$GLB" clips
          SOURCE="clips/Ara-Avatar.glb"
          COMPACT="clips/Ara-Avatar.compact.glb"
          DEST="output-usdz/Ara-Avatar.usdz"
          PY="$GITHUB_WORKSPACE/usdz-forge/engine/python/bin/python3.14"
          cp clips/animation-timeline.json output-usdz/animation-timeline.json
          cp input/animation-diagnostics.txt output-usdz/animation-diagnostics.txt
          cp input/verification-report.txt output-usdz/verification-report.txt
          node scripts/compact-glb-primitives.mjs "$SOURCE" "$COMPACT"
          "$PY" usdz-forge/engine/native/usdzconvert -v "$COMPACT" "$DEST" 2>&1 | tee output-usdz/conversion-log.txt
          "$PY" usdz-forge/engine/inspect_usdz.py "$DEST" | tee output-usdz/usdz-report.txt
          "$PY" scripts/inspect-ara-usdz-animation.py "$DEST" output-usdz/animation-timeline.json | tee output-usdz/usdz-animation-diagnostics.txt
          ARA_PRESET="${{ inputs.preset }}" ARA_DETAIL="${{ inputs.detail }}" \
            "$PY" scripts/ara-research-data.py "$GLB" "$DEST" output-usdz/animation-timeline.json
          grep -q "skelAnimations: 1" output-usdz/usdz-report.txt
          "$PY" - <<'PY'
          import json
          import re
          from pathlib import Path

          timeline = json.loads(Path("output-usdz/animation-timeline.json").read_text())
          expected_fps = float(timeline["fps"])
          expected_end = max(float(clip["end"]) for clip in timeline["clips"])
          expected_end_code = round(expected_end * expected_fps)

          report = Path("output-usdz/usdz-report.txt").read_text()
          fps_match = re.search(r"timeCodesPerSecond\s*:\s*([0-9.]+)", report)
          end_match = re.search(r"endTimeCode\s*:\s*([0-9.]+)", report)
          if not fps_match or abs(float(fps_match.group(1)) - expected_fps) > 0.01:
              raise SystemExit(f"USDZ FPS does not match timeline ({expected_fps})")
          if not end_match or abs(float(end_match.group(1)) - expected_end_code) > 1:
              actual = end_match.group(1) if end_match else "missing"
              raise SystemExit(f"USDZ endTimeCode {actual} does not match timeline {expected_end_code}")
          print(f"USDZ timeline verified: {expected_end:.4f}s, {expected_fps:.0f} FPS, endTimeCode={expected_end_code}")
          PY
          grep -q "GLB animations=75" output-usdz/animation-diagnostics.txt
          "$PY" - <<'PY'
          import re
          from pathlib import Path
          report = Path("output-usdz/usdz-animation-diagnostics.txt").read_text()
          for joint in ("RightArm", "RightForeArm", "RightHand"):
              match = re.search(rf"^{joint}: maxAngleDeltaVsTalk=([0-9.]+)deg;", report, re.M)
              if not match or float(match.group(1)) < 10:
                  raise SystemExit(f"{joint} TalkExplain motion is missing or below 10 degrees")
              print(f"{joint} TalkExplain delta: {match.group(1)} degrees")
          PY
          "$PY" usdz-forge/engine/check_texture.py "$DEST" | tee output-usdz/texture-diagnostics.txt
          if grep -q "RESOLVES      : NO" output-usdz/texture-diagnostics.txt; then
            echo "USDZ contains unresolved texture references"
            exit 1
          fi
          grep -q "RESOLVES      : YES" output-usdz/texture-diagnostics.txt
          test -s output-usdz/ara-research-data.json.gz
          ANIMATED="$("$PY" usdz-forge/engine/native/probe_usdz.py "$DEST")"
          test "$ANIMATED" = "1"
          shasum -a 256 "$DEST" "$GLB" output-usdz/ara-research-data.json.gz | tee output-usdz/SHA256SUMS.txt

      - name: Upload USDZ and research artifact
        uses: actions/upload-artifact@v4
        with:
          name: ara-avatar-research-bundle
          path: output-usdz/**
          if-no-files-found: error
          retention-days: 90

      - name: Publish versioned Ara research assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ara-avatar-v5
          name: Ara Avatar and Research Data v5
          body: |
            Generated from pinned Ara 3D Gen source e26cdef1464a0babf23bb0235b5f05930301ee25 with the ChatAI TalkExplain chest-level gesture patch. Hips sway is baked later in the Codemagic build.
            Includes the generated source GLB, converted RealityKit USDZ, full keyframe-level GLB/USDZ research dataset, conversion log, diagnostics, and expanded Ara runtime timeline: the existing conversation clips plus the 20 approved movement, turn, posture, jump-sequence and horse-test source clips. All 75 original clips remain in the research dataset.
            The compressed research JSON preserves all source GLB animation channels and converted USDZ skeletal/morph samples for offline analysis without rerunning Actions.
          files: |
            input/*.glb
            output-usdz/Ara-Avatar.usdz
            output-usdz/ara-research-data.json.gz
            output-usdz/animation-timeline.json
            output-usdz/animation-diagnostics.txt
            output-usdz/usdz-animation-diagnostics.txt
            output-usdz/texture-diagnostics.txt
            output-usdz/verification-report.txt
            output-usdz/conversion-log.txt
            output-usdz/SHA256SUMS.txt
            output-usdz/usdz-report.txt
            output-usdz/ara-asset-pipeline.txt
          fail_on_unmatched_files: true
          overwrite_files: false
