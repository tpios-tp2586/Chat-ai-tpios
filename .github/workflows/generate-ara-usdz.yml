name: Generate Ara USDZ avatar assets

on:
  workflow_dispatch:
    inputs:
      preset:
        description: Ara character preset
        required: true
        default: Athletic woman
        type: choice
        options:
          - Athletic woman
          - Athletic man
      detail:
        description: Mesh detail
        required: true
        default: high
        type: choice
        options:
          - medium
          - high

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out ChatAI
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check out pinned Ara generator source
        uses: actions/checkout@v4
        with:
          repository: olatunde85/3d-gen
          ref: e26cdef1464a0babf23bb0235b5f05930301ee25
          path: ara

      - name: Apply ChatAI conversational gesture
        run: node scripts/apply-ara-talk-explain.mjs ara

      - name: Install Ara dependencies
        working-directory: ara
        run: npm install

      - name: Generate and verify rigged GLB
        working-directory: ara
        run: |
          mkdir -p ../output
          npm run setup-assets
          npm run export -- --preset "${{ inputs.preset }}" --detail "${{ inputs.detail }}" --formats glb --out ../output
          cd ..
          GLB="$(find output -maxdepth 1 -type f -name '*.glb' -print -quit)"
          test -n "$GLB"
          node scripts/verify-glb.mjs "$GLB"
          node scripts/inspect-ara-animation.mjs "$GLB"

      - name: Upload GLB intermediate artifact
        uses: actions/upload-artifact@v4
        with:
          name: ara-avatar-glb
          path: |
            output/*.glb
            output/verification-report.txt
            output/animation-diagnostics.txt
          if-no-files-found: error
          retention-days: 90

  convert:
    needs: generate
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Check out ChatAI
        uses: actions/checkout@v4

      - name: Download GLB intermediate artifact
        uses: actions/download-artifact@v4
        with:
          name: ara-avatar-glb
          path: input

      - name: Check out USDZ Forge
        uses: actions/checkout@v4
        with:
          repository: robotson/usdz-forge
          path: usdz-forge

      - name: Set up USDZ conversion engine
        working-directory: usdz-forge
        run: ./engine/setup-engine.sh

      - name: Convert, inspect and archive Ara research data
        run: |
          set -euo pipefail
          GLB="$(find input -maxdepth 1 -type f -name '*.glb' -print -quit)"
          test -n "$GLB"
          mkdir -p clips output-usdz
          node scripts/split-glb-animations.mjs "$GLB" clips
          SOURCE="clips/Ara-Avatar.glb"
          COMPACT="clips/Ara-Avatar.compact.glb"
          DEST="output-usdz/Ara-Avatar.usdz"
          PY="$GITHUB_WORKSPACE/usdz-forge/engine/python/bin/python3.14"
          cp clips/animation-timeline.json output-usdz/animation-timeline.json
          cp input/animation-diagnostics.txt output-usdz/animation-diagnostics.txt
          cp input/verification-report.txt output-usdz/verification-report.txt
          node scripts/compact-glb-primitives.mjs "$SOURCE" "$COMPACT"
          "$PY" usdz-forge/engine/native/usdzconvert -v "$COMPACT" "$DEST" 2>&1 | tee output-usdz/conversion-log.txt
          "$PY" usdz-forge/engine/inspect_usdz.py "$DEST" | tee output-usdz/usdz-report.txt
          "$PY" scripts/inspect-ara-usdz-animation.py "$DEST" output-usdz/animation-timeline.json | tee output-usdz/usdz-animation-diagnostics.txt
          ARA_PRESET="${{ inputs.preset }}" ARA_DETAIL="${{ inputs.detail }}" \
            "$PY" scripts/ara-research-data.py "$GLB" "$DEST" output-usdz/animation-timeline.json
          grep -q "skelAnimations: 1" output-usdz/usdz-report.txt
          grep -Eq "endTimeCode[[:space:]]*:[[:space:]]*780" output-usdz/usdz-report.txt
          grep -q "timeCodesPerSecond: 30.0" output-usdz/usdz-report.txt
          grep -q "GLB animations=75" output-usdz/animation-diagnostics.txt
          grep -q "TalkExplain/RightForeArm" output-usdz/usdz-animation-diagnostics.txt
          test -s output-usdz/ara-research-data.json.gz
          ANIMATED="$("$PY" usdz-forge/engine/native/probe_usdz.py "$DEST")"
          test "$ANIMATED" = "1"
          shasum -a 256 "$DEST" "$GLB" output-usdz/ara-research-data.json.gz | tee output-usdz/SHA256SUMS.txt

      - name: Upload USDZ and research artifact
        uses: actions/upload-artifact@v4
        with:
          name: ara-avatar-research-bundle
          path: output-usdz/**
          if-no-files-found: error
          retention-days: 90

      - name: Publish versioned Ara research assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ara-avatar-v3
          name: Ara Avatar and Research Data v3
          body: |
            Generated from pinned Ara 3D Gen source e26cdef1464a0babf23bb0235b5f05930301ee25 with the ChatAI TalkExplain chest-level gesture patch.
            Includes the generated source GLB, converted RealityKit USDZ, full keyframe-level GLB/USDZ research dataset, conversion log, diagnostics, and eight-clip 26-second timeline.
            The compressed research JSON preserves all source GLB animation channels and converted USDZ skeletal/morph samples for offline analysis without rerunning Actions.
          files: |
            input/*.glb
            output-usdz/Ara-Avatar.usdz
            output-usdz/ara-research-data.json.gz
            output-usdz/animation-timeline.json
            output-usdz/animation-diagnostics.txt
            output-usdz/usdz-animation-diagnostics.txt
            output-usdz/verification-report.txt
            output-usdz/conversion-log.txt
            output-usdz/SHA256SUMS.txt
            output-usdz/usdz-report.txt
          fail_on_unmatched_files: true
          overwrite_files: true
