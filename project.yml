name: ChatAI
options:
  bundleIdPrefix: com.tpios
targets:
  ChatAI:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: ChatAI
        excludes:
          - Resources/**
          - ChatAIHead3DView.swift
    info:
      path: ChatAI-Info.plist
      properties:
        CFBundleDisplayName: "Chat AI"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        LSRequiresIPhoneOS: true
        NSMicrophoneUsageDescription: "Ứng dụng cần quyền micro để ghi âm giọng nói khi trò chuyện."
    resources:
  - path: Reference/FaceExpressions/companion_angry.jpg
  - path: Reference/FaceExpressions/companion_happy.jpg
  - path: Reference/FaceExpressions/companion_neutral.jpg
  - path: Reference/FaceExpressions/companion_sleepy.jpg
  - path: Reference/FaceExpressions/companion_speaking.jpg
  - path: Reference/FaceExpressions/companion_surprised.jpg
  - path: Reference/FaceExpressions/companion_thinking.jpg
  - path: Reference/FaceExpressions/companion_wink.jpg
    dependencies:
      - sdk: AVFoundation.framework
      - sdk: Speech.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tpios.chatai
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
